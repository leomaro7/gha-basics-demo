name: hello

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  greet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Say hello
        run: |
          echo "Hello from ${{ github.repository }}"
          echo "event=${{ github.event_name }} os=${{ runner.os }}"
          ls -la
